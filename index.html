<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard: Uso do Telemóvel na Aula</title>
  <!-- Biblioteca Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Link para o ficheiro CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    <!-- Cabeçalho -->
    <header class="header">
      <h1>Dashboard: Uso do Telemóvel na Aula</h1>
      <p class="subtitulo">Análise de atenção e distrações dos alunos (27 respostas)</p>
    </header>

    <!-- Área Principal com Gráfico 1 e Gráfico 2 -->
    <main class="charts-grid">
      <div class="chart-card">
        <h2>Gráfico 1: Notificações que mais tiram a atenção</h2>
        <div class="chart-box">
          <canvas id="graficoPizza"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <h2>Gráfico 2: Reação quando o telemóvel toca/vibra</h2>
        <div class="chart-box">
          <canvas id="graficoBarras"></canvas>
        </div>
      </div>
    </main>
  </div>

  <!-- Link para o ficheiro JS -->
  <script src="script.js"></script>
</body>
</html>
